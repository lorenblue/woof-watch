services:
  postgres:
    image: postgres:18-alpine
    container_name: woof-watch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    image: ghcr.io/lorenblue/woof-watch:latest
    pull_policy: always
    container_name: woof-watch-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ORIGIN: ${ORIGIN:-https://${APP_DOMAIN}}
      DEFAULT_ACTORS: ${DEFAULT_ACTORS:-}
      DEFAULT_DOGS: ${DEFAULT_DOGS:-}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      REMINDER_RUN_SECRET: ${REMINDER_RUN_SECRET:-}
      REMINDER_TIME_ZONE: ${REMINDER_TIME_ZONE:-America/Vancouver}
      REMINDER_DUE_WINDOW_MINUTES: ${REMINDER_DUE_WINDOW_MINUTES:-30}
      REMINDER_CONFIG_PATH: ${REMINDER_CONFIG_PATH:-/app/config/reminders.json}
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web'
      - 'traefik.http.routers.woofwatch.rule=Host(`${APP_DOMAIN}`)'
      - 'traefik.http.routers.woofwatch.entrypoints=websecure'
      - 'traefik.http.routers.woofwatch.tls.certresolver=myresolver'
      - 'traefik.http.services.woofwatch.loadbalancer.server.port=3000'
    volumes:
      - ./config:/app/config:ro
    networks:
      - web
      - internal

  reminders:
    image: curlimages/curl:latest
    container_name: woof-watch-reminders
    restart: unless-stopped
    depends_on:
      - app
    environment:
      REMINDER_RUN_SECRET: ${REMINDER_RUN_SECRET}
      REMINDER_RUN_INTERVAL_SECONDS: ${REMINDER_RUN_INTERVAL_SECONDS:-900}
    command:
      - sh
      - -c
      - |
        while true; do
          curl -sS -X POST -H "Authorization: Bearer $${REMINDER_RUN_SECRET}" "http://app:3000/api/reminders/run" || true
          sleep "$${REMINDER_RUN_INTERVAL_SECONDS}"
        done
    networks:
      - internal

volumes:
  postgres_data:

networks:
  web:
    external: true
  internal:
    driver: bridge
