services:
  postgres:
    image: postgres:18-alpine
    container_name: woof-watch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal 

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: woof-watch-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DEFAULT_ACTORS: ${DEFAULT_ACTORS}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.woofwatch.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.woofwatch.entrypoints=websecure"
      - "traefik.http.routers.woofwatch.tls.certresolver=myresolver"
      - "traefik.http.services.woofwatch.loadbalancer.server.port=3000"
    networks:
      - web       
      - internal

volumes:
  postgres_data:

networks:
  web:
    external: true
  internal:
    driver: bridge