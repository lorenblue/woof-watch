services:
  postgres:
    image: postgres:16
    container_name: woof-watch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: woof_watch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d woof_watch"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
