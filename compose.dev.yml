services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: woof-watch:dev
    container_name: woof-watch-app-dev
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/app/data/woof-watch.db
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      DEFAULT_ACTORS: ${DEFAULT_ACTORS:-}
      DEFAULT_DOGS: ${DEFAULT_DOGS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      REMINDER_RUN_SECRET: ${REMINDER_RUN_SECRET:-}
      REMINDER_TIME_ZONE: ${REMINDER_TIME_ZONE:-America/Vancouver}
      REMINDER_DUE_WINDOW_MINUTES: ${REMINDER_DUE_WINDOW_MINUTES:-30}
      REMINDER_CONFIG_PATH: ${REMINDER_CONFIG_PATH:-/app/config/reminders.json}
    ports:
      - '3000:3000'
    volumes:
      - ./config:/app/config:ro
      - sqlite_data:/app/data

volumes:
  sqlite_data:
